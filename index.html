            window.loadAttendanceStudents = async function() {
                const level = document.getElementById('attendanceLevel').value;
                const group = document.getElementById('attendanceGroup').value;
                const tbody = document.getElementById('attendanceTableBody');
                
                if (!level || !group) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center p-8 text-gray-500">الرجاء اختيار المستوى والفوج</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '<tr><td colspan="2" class="text-center p-8 text-gray-500">جاري التحميل...</td></tr>';
                
                try {
                    const { data, error } = await supabaseClient
                        .from('students')
                        .select('*')
                        .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                        .eq('level', level)
                        .eq('group_name', group);
                        
                    if (error) throw error;
                    
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="2" class="text-center p-8 text-gray-500">لا يوجد طلاب في هذا الفوج</td></tr>';
                        return;
                    }
                    
                    window.attendanceStudentsList = data;
                    
                    // Fetch existing attendance records
                    const dateInput = document.getElementById('attendance-date') || document.getElementById('attendanceDate');
                    const selectedDate = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
                    
                    const { data: attendanceRecords, error: attendanceError } = await supabaseClient
                        .from('attendance')
                        .select('*')
                        .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                        .eq('level', level)
                        .eq('group_name', group)
                        .eq('date', selectedDate);
                        
                    if (attendanceError) {
                        console.warn('Error fetching attendance records:', attendanceError);
                    }

                    window.existingAttendanceMap = {};
                    if (attendanceRecords) {
                        attendanceRecords.forEach(record => {
                            window.existingAttendanceMap[record.student_id] = record.status;
                        });
                    }

                    window.renderAttendanceTable();
                } catch (error) {
                    console.error('Error loading attendance students:', error);
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center p-8 text-red-500">حدث خطأ أثناء جلب الطلاب</td></tr>';
                }
            };

            window.renderAttendanceTable = function() {
                const tbody = document.getElementById('attendanceTableBody');
                const downloadBtn = document.getElementById('downloadAttendanceBtn');
                if (!tbody || !window.attendanceStudentsList) return;
                
                if (window.attendanceStudentsList.length === 0) {
                    if (downloadBtn) downloadBtn.classList.add('hidden');
                    return;
                }
                
                if (downloadBtn) downloadBtn.classList.remove('hidden');

                tbody.innerHTML = window.attendanceStudentsList.map(student => {
                    const status = (window.existingAttendanceMap && window.existingAttendanceMap[student.id]) || null;
                    
                    const pClass = status === 'present' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-400 hover:bg-green-100 hover:text-green-600';
                    const aClass = status === 'absent' ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-400 hover:bg-red-100 hover:text-red-600';
                    const wClass = status === 'withdrawn' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-400 hover:bg-orange-100 hover:text-orange-600';
                    
                    return `
                    <tr class="hover:bg-gray-50 transition border-b border-gray-50 last:border-0">
                        <td class="p-4 font-medium text-gray-900">${student.first_name || ''} ${student.last_name || ''}</td>
                        <td class="p-4">
                            <div class="flex items-center justify-end gap-3">
                                <button id="att-present-${student.id}" onclick="markAttendance('${student.id}', 'present')" class="w-10 h-10 rounded-lg flex items-center justify-center transition ${pClass}" title="حاضر">
                                    <i data-lucide="check" class="w-5 h-5"></i>
                                </button>
                                <button id="att-absent-${student.id}" onclick="markAttendance('${student.id}', 'absent')" class="w-10 h-10 rounded-lg flex items-center justify-center transition ${aClass}" title="غائب">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                                <button id="att-withdrawn-${student.id}" onclick="markAttendance('${student.id}', 'withdrawn')" class="w-10 h-10 rounded-lg flex items-center justify-center transition ${wClass}" title="متخلي">
                                    <i data-lucide="minus" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `}).join('');
                if(window.lucide) lucide.createIcons();
            };

            window.markAttendance = async function(studentId, status) {
                const dateInput = document.getElementById('attendance-date') || document.getElementById('attendanceDate');
                const date = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
                const buttons = ['present', 'absent', 'withdrawn'].map(s => document.getElementById(`att-${s}-${studentId}`));
                
                buttons.forEach(b => { if(b) b.disabled = true; });
                
                try {
                    const student = (window.attendanceStudentsList || []).find(s => s.id == studentId) || {};
                    const studentName = student.first_name && student.last_name 
                        ? `${student.first_name} ${student.last_name}` 
                        : (student.first_name || student.last_name || '');
                    const teacherName = (userProfile && userProfile.full_name) 
                        || (currentUser && currentUser.profile && currentUser.profile.full_name) 
                        || (currentUser ? currentUser.email : '');
                    const groupName = student.group_name || document.getElementById('attendanceGroup')?.value || '';
                    const level = student.level || document.getElementById('attendanceLevel')?.value || '';

                    const attendancePayload = {
                        student_id: student.id || studentId,
                        student_name: studentName,
                        group_name: groupName,
                        level: level,
                        teacher_id: currentUser ? currentUser.id : null,
                        teacher_name: teacherName,
                        status: status,
                        date: date,
                        session: window.currentSession || null
                    };

                    // 1. Check if record exists
                    const { data: existingRecords, error: fetchError } = await supabaseClient
                        .from('attendance')
                        .select('id')
                        .eq('student_id', student.id || studentId)
                        .eq('date', date);
                        
                    if (fetchError) throw fetchError;
                    
                    if (existingRecords && existingRecords.length > 0) {
                        // 2. Update existing
                        const { error: updateError } = await supabaseClient
                            .from('attendance')
                            .update(attendancePayload)
                            .eq('id', existingRecords[0].id);
                        if (updateError) throw updateError;
                    } else {
                        // 3. Insert new
                        const { error: insertError } = await supabaseClient
                            .from('attendance')
                            .insert([attendancePayload]);
                        if (insertError) throw insertError;
                    }
                    
                    const msg = document.getElementById('attendanceNotification');
                    msg.textContent = 'تم تسجيل الحضور';
                    msg.className = 'mb-4 p-3 rounded-lg font-medium text-center shadow-sm bg-green-50 text-green-700 block';
                    setTimeout(() => msg.classList.add('hidden'), 3000);
                    
                    // Update UI colors
                    const configs = {
                        present: { id: `att-present-${studentId}`, active: ['bg-green-500', 'text-white'], default: ['bg-gray-100', 'text-gray-400', 'hover:bg-green-100', 'hover:text-green-600'] },
                        absent: { id: `att-absent-${studentId}`, active: ['bg-red-500', 'text-white'], default: ['bg-gray-100', 'text-gray-400', 'hover:bg-red-100', 'hover:text-red-600'] },
                        withdrawn: { id: `att-withdrawn-${studentId}`, active: ['bg-orange-500', 'text-white'], default: ['bg-gray-100', 'text-gray-400', 'hover:bg-orange-100', 'hover:text-orange-600'] }
                    };
                    
                    Object.keys(configs).forEach(st => {
                        const btn = document.getElementById(configs[st].id);
                        if (!btn) return;
                        
                        btn.classList.remove('hover:bg-green-100', 'hover:text-green-600', 'hover:bg-red-100', 'hover:text-red-600', 'hover:bg-orange-100', 'hover:text-orange-600');
                        btn.classList.remove(...configs[st].active);
                        btn.classList.remove(...configs[st].default);
                        
                        if (st === status) {
                            btn.classList.add(...configs[st].active);
                        } else {
                            btn.classList.add(...configs[st].default);
                        }
                    });
                    
                } catch (error) {
                    console.error('Error recording attendance:', error);
                    const msg = document.getElementById('attendanceNotification');
                    msg.textContent = 'حدث خطأ أثناء التسجيل: ' + (error.message || JSON.stringify(error));
                    msg.className = 'mb-4 p-3 rounded-lg font-medium text-center shadow-sm bg-red-50 text-red-700 block';
                    setTimeout(() => msg.classList.add('hidden'), 3000);
                } finally {
                    buttons.forEach(b => { if(b) b.disabled = false; });
                }
            };

            const today = new Date().toISOString().split('T')[0];

            return `
                <div class="max-w-4xl mx-auto">
                    <div id="attendanceNotification" class="hidden"></div>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">تسجيل الحضور</h2>
                        <div class="flex items-center gap-2">
                            <button id="downloadAttendanceBtn" onclick="exportAttendanceSheet(event)" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2 transition">
                                <i data-lucide="download" class="w-5 h-5"></i> تصدير Word
                            </button>
                            <input type="date" id="attendance-date" value="${today}" onchange="loadAttendanceStudents()" class="p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-600 bg-white shadow-sm" dir="ltr">
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">المستوى</label>
                            <select id="attendanceLevel" onchange="handleAttendanceLevelChange()" class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-600 bg-white">
                                <option value="">اختر المستوى...</option>
                                <option value="A1">A1</option>
                                <option value="A2">A2</option>
                                <option value="B1.1">B1.1</option>
                                <option value="B1.2">B1.2</option>
                                <option value="B2.1">B2.1</option>
                                <option value="B2.2">B2.2</option>
                                <option value="C1.1">C1.1</option>
                                <option value="C1.2">C1.2</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">الفوج</label>
                            <select id="attendanceGroup" onchange="loadAttendanceStudents()" class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-600 bg-white">
                                <option value="">اختر الفوج...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right">
                                <thead class="bg-gray-50 text-gray-600 text-sm border-b border-gray-100">
                                    <tr>
                                        <th class="p-4 font-semibold">الطالب (الاسم واللقب)</th>
                                        <th class="p-4 font-semibold text-end">تسجيل الحضور</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody" class="divide-y divide-gray-100">
                                    <tr>
                                        <td colspan="2" class="text-center p-8 text-gray-500">الرجاء اختيار المستوى والفوج</td>

        }

        // --- Exams Section Logic ---
        function renderExamsSection() {
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;

            window.handleExamLevelChange = async function() {
                const level = document.getElementById('examLevel').value;
                const groupSelect = document.getElementById('examGroup');
                groupSelect.innerHTML = '<option value="">اختر الفوج...</option>';
                const tbody = document.getElementById('examsTableBody');
                if (tbody) tbody.innerHTML = '<tr><td colspan="9" class="text-center p-8 text-gray-500">الرجاء اختيار المستوى والفوج</td></tr>';

                if (!level || !currentUser) return;

                try {
                    const { data, error } = await supabase
                        .from('students')
                        .select('group_name')
                        .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                        .eq('level', level);

                    if (error) throw error;

                    const uniqueGroups = [...new Set((data || []).map(item => item.group_name))].filter(Boolean).sort();
                    uniqueGroups.forEach(group => {
                        groupSelect.innerHTML += `<option value="${group}">${group}</option>`;
                    });
                } catch (error) {
                    console.error('Error fetching exam groups:', error);
                }
            };

            window.loadExamStudents = async function() {
                const level = document.getElementById('examLevel').value;
                const group = document.getElementById('examGroup').value;
                const dateInput = document.getElementById('exam-date') || document.getElementById('examDate');
                const selectedDate = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
                const tbody = document.getElementById('examsTableBody');

                if (!tbody) return;

                if (!level || !group) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center p-8 text-gray-500">الرجاء اختيار المستوى والفوج</td></tr>';
                    return;
                }

                tbody.innerHTML = '<tr><td colspan="9" class="text-center p-8 text-gray-500">جاري التحميل...</td></tr>';

                try {
                    // 1. Fetch students
                    const { data: students, error: studentError } = await supabase
                        .from('students')
                        .select('*')
                        .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                        .eq('level', level)
                        .eq('group_name', group);

                    if (studentError) throw studentError;

                    if (!students || students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="9" class="text-center p-8 text-gray-500">لا يوجد طلاب في هذا الفوج</td></tr>';
                        window.examStudentsList = [];
                        return;
                    }

                    window.examStudentsList = students;

                    // 2. Fetch existing grades for selectedDate
                    const { data: gradesData, error: gradesError } = await supabase
                        .from('student_grades')
                        .select('*')
                        .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                        .eq('level', level)
                        .eq('group_name', group)
                        .eq('exam_date', selectedDate);

                    if (gradesError) {
                        console.warn('Error fetching existing grades:', gradesError);
                    }

                    window.existingGradesMap = {};
                    if (gradesData) {
                        gradesData.forEach(g => {
                            window.existingGradesMap[g.student_id] = g;
                        });
                    }

                    window.renderExamsTable();
                } catch (error) {
                    console.error('Error loading exam students:', error);
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center p-8 text-red-500">حدث خطأ أثناء جلب بيانات الطلاب أو الدرجات</td></tr>';
                }
            };

            window.renderExamsTable = function() {
                const tbody = document.getElementById('examsTableBody');
                const downloadBtn = document.getElementById('downloadExamsBtn');
                if (!tbody || !window.examStudentsList) return;
                
                if (window.examStudentsList.length === 0) {
                    if (downloadBtn) downloadBtn.classList.add('hidden');
                    return;
                }
                
                if (downloadBtn) downloadBtn.classList.remove('hidden');

                tbody.innerHTML = window.examStudentsList.map(student => {
                    const grade = (window.existingGradesMap && window.existingGradesMap[student.id]) || {};
                    const speaking = grade.speaking !== undefined && grade.speaking !== null ? grade.speaking : '';
                    const oral = grade.oral !== undefined && grade.oral !== null ? grade.oral : '';
                    const reading = grade.reading !== undefined && grade.reading !== null ? grade.reading : '';
                    const writing = grade.writing !== undefined && grade.writing !== null ? grade.writing : '';
                    const grammar = grade.grammar !== undefined && grade.grammar !== null ? grade.grammar : '';
                    const vocabulary = grade.vocabulary !== undefined && grade.vocabulary !== null ? grade.vocabulary : '';

                    let moyenVal = '';
                    let decText = '---';
                    let decClass = 'px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-500 border border-gray-200';

                    if (grade.moyen !== undefined && grade.moyen !== null) {
                        moyenVal = Number(grade.moyen).toFixed(2);
                        const isAdmis = grade.decision === 'admis' || Number(moyenVal) >= 10;
                        decText = isAdmis ? 'ناجح (Admis)' : 'مؤجل (Adjournée)';
                        decClass = isAdmis 
                            ? 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 border border-green-200'
                            : 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 border border-red-200';
                    }

                    return `
                        <tr class="hover:bg-gray-50/80 transition border-b border-gray-100 last:border-0">
                            <td class="p-3 font-medium text-gray-900 whitespace-nowrap">
                                ${student.first_name || ''} ${student.last_name || ''}
                            </td>
                            <td class="p-2 bg-blue-50/30 text-center">
                                <input type="number" min="0" max="20" step="0.25" id="speaking-${student.id}" value="${speaking}" oninput="calculateExamGrade('${student.id}')" onblur="calculateExamGrade('${student.id}')" placeholder="0-20" class="w-20 p-2 text-center border border-blue-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white font-semibold text-gray-800">
                            </td>
                            <td class="p-2 bg-green-50/30 text-center">
                                <input type="number" min="0" max="20" step="0.25" id="oral-${student.id}" value="${oral}" oninput="calculateExamGrade('${student.id}')" onblur="calculateExamGrade('${student.id}')" placeholder="0-20" class="w-20 p-2 text-center border border-green-200 rounded-lg outline-none focus:ring-2 focus:ring-green-500 bg-white font-semibold text-gray-800">
                            </td>
                            <td class="p-2 bg-purple-50/30 text-center">
                                <input type="number" min="0" max="20" step="0.25" id="reading-${student.id}" value="${reading}" oninput="calculateExamGrade('${student.id}')" onblur="calculateExamGrade('${student.id}')" placeholder="0-20" class="w-20 p-2 text-center border border-purple-200 rounded-lg outline-none focus:ring-2 focus:ring-purple-500 bg-white font-semibold text-gray-800">
                            </td>
                            <td class="p-2 bg-amber-50/30 text-center">
                                <input type="number" min="0" max="20" step="0.25" id="writing-${student.id}" value="${writing}" oninput="calculateExamGrade('${student.id}')" onblur="calculateExamGrade('${student.id}')" placeholder="0-20" class="w-20 p-2 text-center border border-amber-200 rounded-lg outline-none focus:ring-2 focus:ring-amber-500 bg-white font-semibold text-gray-800">
                            </td>
                            <td class="p-2 bg-rose-50/30 text-center">
                                <input type="number" min="0" max="20" step="0.25" id="grammar-${student.id}" value="${grammar}" oninput="calculateExamGrade('${student.id}')" onblur="calculateExamGrade('${student.id}')" placeholder="0-20" class="w-20 p-2 text-center border border-rose-200 rounded-lg outline-none focus:ring-2 focus:ring-rose-500 bg-white font-semibold text-gray-800">
                            </td>
                            <td class="p-2 bg-teal-50/30 text-center">
                                <input type="number" min="0" max="20" step="0.25" id="vocabulary-${student.id}" value="${vocabulary}" oninput="calculateExamGrade('${student.id}')" onblur="calculateExamGrade('${student.id}')" placeholder="0-20" class="w-20 p-2 text-center border border-teal-200 rounded-lg outline-none focus:ring-2 focus:ring-teal-500 bg-white font-semibold text-gray-800">
                            </td>
                            <td class="p-2 bg-yellow-100/50 text-center">
                                <input type="text" disabled readonly id="moyen-${student.id}" value="${moyenVal}" placeholder="0.00" class="w-20 p-2 text-center border border-yellow-300 rounded-lg bg-yellow-50 font-bold text-gray-900">
                            </td>
                            <td class="p-3 text-center whitespace-nowrap">
                                <span id="decision-${student.id}" class="${decClass}">${decText}</span>
                            </td>
                        </tr>
                    `;
                }).join('');

                if (window.lucide) lucide.createIcons();
            };

            window.calculateExamGrade = function(studentId) {
                const getVal = (id) => {
                    const el = document.getElementById(`${id}-${studentId}`);
                    const val = parseFloat(el ? el.value : 0);
                    return isNaN(val) ? 0 : val;
                };

                const speaking = getVal('speaking');
                const oral = getVal('oral');
                const reading = getVal('reading');
                const writing = getVal('writing');
                const grammar = getVal('grammar');
                const vocabulary = getVal('vocabulary');

                const moyen = (speaking + oral + reading + writing + grammar + vocabulary) / 6;
                const formattedMoyen = moyen.toFixed(2);
                const decision = moyen >= 10 ? 'admis' : 'adjournée';

                const moyenEl = document.getElementById(`moyen-${studentId}`);
                if (moyenEl) moyenEl.value = formattedMoyen;

                const decEl = document.getElementById(`decision-${studentId}`);
                if (decEl) {
                    if (decision === 'admis') {
                        decEl.textContent = 'ناجح (Admis)';
                        decEl.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 border border-green-200';
                    } else {
                        decEl.textContent = 'مؤجل (Adjournée)';
                        decEl.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 border border-red-200';
                    }
                }
            };

            window.saveExamGrades = async function() {
                const selectedLevel = document.getElementById('examLevel').value;
                const selectedGroup = document.getElementById('examGroup').value;
                const dateInput = document.getElementById('exam-date') || document.getElementById('examDate');
                const examDate = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
                const notif = document.getElementById('examNotification');
                const saveBtn = document.getElementById('saveExamsBtn');

                if (!selectedLevel || !selectedGroup) {
                    if (notif) {
                        notif.textContent = 'الرجاء اختيار المستوى والفوج';
                        notif.className = 'mb-4 p-3 rounded-lg font-medium text-center shadow-sm bg-red-50 text-red-700 block';
                        setTimeout(() => notif.classList.add('hidden'), 3000);
                    }
                    return;
                }

                if (!window.examStudentsList || window.examStudentsList.length === 0) {
                    if (notif) {
                        notif.textContent = 'لا يوجد طلاب لحفظ درجاتهم';
                        notif.className = 'mb-4 p-3 rounded-lg font-medium text-center shadow-sm bg-amber-50 text-amber-700 block';
                        setTimeout(() => notif.classList.add('hidden'), 3000);
                    }
                    return;
                }

                saveBtn.disabled = true;
                const originalText = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> جاري الحفظ...';

                try {
                    const records = window.examStudentsList.map(student => {
                        const getVal = (id) => {
                            const el = document.getElementById(`${id}-${student.id}`);
                            const val = parseFloat(el ? el.value : 0);
                            return isNaN(val) ? 0 : val;
                        };

                        const speaking = getVal('speaking');
                        const oral = getVal('oral');
                        const reading = getVal('reading');
                        const writing = getVal('writing');
                        const grammar = getVal('grammar');
                        const vocabulary = getVal('vocabulary');
                        const moyen = parseFloat(((speaking + oral + reading + writing + grammar + vocabulary) / 6).toFixed(2));
                        const decision = moyen >= 10 ? 'admis' : 'adjournée';

                        const studentName = `${student.first_name || ''} ${student.last_name || ''}`.trim();

                        return {
                            student_id: student.id,
                            teacher_id: currentUser ? currentUser.id : null,
                            student_name: studentName,
                            level: selectedLevel,
                            group_name: selectedGroup,
                            speaking: speaking,
                            oral: oral,
                            reading: reading,
                            writing: writing,
                            grammar: grammar,
                            vocabulary: vocabulary,
                            moyen: moyen,
                            decision: decision,
                            exam_date: examDate,
                            session: window.currentSession || null
                        };
                    });

                    const { error } = await supabase
                        .from('student_grades')
                        .upsert(records, { onConflict: 'student_id,exam_date' });

                    if (error) throw error;

                    if (notif) {
                        notif.textContent = 'تم حفظ الدرجات بنجاح';
                        notif.className = 'mb-4 p-3 rounded-lg font-medium text-center shadow-sm bg-green-50 text-green-700 block';
                        setTimeout(() => notif.classList.add('hidden'), 3000);
                    }
                } catch (error) {
                    console.error('Error saving exam grades:', error);
                    if (notif) {
                        notif.textContent = 'حدث خطأ أثناء حفظ الدرجات: ' + (error.message || JSON.stringify(error));
                        notif.className = 'mb-4 p-3 rounded-lg font-medium text-center shadow-sm bg-red-50 text-red-700 block';
                        setTimeout(() => notif.classList.add('hidden'), 4000);
                    }
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalText;
                    if (window.lucide) lucide.createIcons();
                }
            };

            const today = new Date().toISOString().split('T')[0];

            return `
                <div class="max-w-6xl mx-auto">
                    <div id="examNotification" class="hidden"></div>
                    
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">إدارة امتحانات ودرجات الطلاب</h2>
                        <div class="flex items-center gap-2 bg-white p-2 rounded-lg border border-gray-200 shadow-sm">
                            <button id="downloadExamsBtn" onclick="exportExamsSheet(event)" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded text-sm font-medium flex items-center gap-2 transition ml-2">
                                <i data-lucide="download" class="w-4 h-4"></i> تصدير Word
                            </button>
                            <label for="exam-date" class="text-sm font-medium text-gray-700 whitespace-nowrap">تاريخ الامتحان:</label>
                            <input type="date" id="exam-date" value="${today}" onchange="loadExamStudents()" class="p-1.5 border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-green-600 bg-white text-sm" dir="ltr">
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">المستوى</label>
                            <select id="examLevel" onchange="handleExamLevelChange()" class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-600 bg-white">
                                <option value="">اختر المستوى...</option>
                                <option value="A1">A1</option>
                                <option value="A2">A2</option>
                                <option value="B1.1">B1.1</option>
                                <option value="B1.2">B1.2</option>
                                <option value="B2.1">B2.1</option>
                                <option value="B2.2">B2.2</option>
                                <option value="C1.1">C1.1</option>
                                <option value="C1.2">C1.2</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">الفوج</label>
                            <select id="examGroup" onchange="loadExamStudents()" class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-600 bg-white">
                                <option value="">اختر الفوج...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Exam Grades Table Card -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right border-collapse">
                                <thead class="bg-gray-50 text-gray-700 text-sm border-b border-gray-200">
                                    <tr>
                                        <th class="p-3 font-semibold text-gray-900">الطالب</th>
                                        <th class="p-3 font-semibold bg-blue-50/60 text-blue-900 text-center min-w-[90px]">Speaking</th>
                                        <th class="p-3 font-semibold bg-green-50/60 text-green-900 text-center min-w-[90px]">Oral</th>
                                        <th class="p-3 font-semibold bg-purple-50/60 text-purple-900 text-center min-w-[90px]">Reading</th>
                                        <th class="p-3 font-semibold bg-amber-50/60 text-amber-900 text-center min-w-[90px]">Writing</th>
                                        <th class="p-3 font-semibold bg-rose-50/60 text-rose-900 text-center min-w-[90px]">Grammar</th>
                                        <th class="p-3 font-semibold bg-teal-50/60 text-teal-900 text-center min-w-[95px]">Vocabulary</th>
                                        <th class="p-3 font-bold bg-yellow-100 text-yellow-900 text-center min-w-[95px]">Moyen</th>
                                        <th class="p-3 font-bold text-center min-w-[110px]">Décision</th>
                                    </tr>
                                </thead>
                                <tbody id="examsTableBody" class="divide-y divide-gray-100 text-sm">
                                    <tr>
                                        <td colspan="9" class="text-center p-8 text-gray-500">الرجاء اختيار المستوى والفوج</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-end">
                            <button id="saveExamsBtn" onclick="saveExamGrades()" class="px-6 py-2.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium shadow-sm flex items-center gap-2">
                                <i data-lucide="save" class="w-5 h-5"></i> حفظ الدرجات
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Messages Section ---
        window.currentMessagesTab = 'inbox';
        window.messagesData = [];

        function renderMessagesSection() {
            return `
                <div class="max-w-6xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">الرسائل والمراسلات</h2>

                        <div id="messagesList" class="divide-y divide-gray-100">

                        </div>
                    </div>
                </div>

                <!-- Send Message Modal -->
                <div id="sendMessageModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50">
                            <h3 class="text-lg font-bold text-gray-800">إرسال رسالة جديدة</h3>

                                <i data-lucide="x" class="w-5 h-5"></i>

                        <div class="p-6 overflow-y-auto">
                            <form id="sendMessageForm" onsubmit="sendNewMessage(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">إلى (المستلم)</label>
                                    <select id="msgReceiver" required class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-600 bg-white">
                                        <option value="">جاري التحميل...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">نوع الرسالة</label>
                                    <select id="msgType" onchange="handleMsgTypeChange()" required class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-600 bg-white">
                                        <option value="توجيه إداري">توجيه إداري</option>
                                        <option value="استفسار">استفسار</option>
                                        <option value="طلب">طلب</option>
                                        <option value="تبليغ عن طالب">تبليغ عن طالب</option>
                                    </select>
                                </div>
                                <div id="msgStudentContainer" class="hidden">
                                    <label class="block text-sm font-medium text-gray-700 mb-1">الطالب المعني</label>
                                    <select id="msgStudent" class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-600 bg-white">
                                        <option value="">اختر الطالب...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">الموضوع</label>
                                    <input type="text" id="msgSubject" required class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-600">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">محتوى الرسالة</label>
                                    <textarea id="msgContent" required rows="4" class="w-full p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-600 resize-none"></textarea>
                                </div>
                                <div class="pt-2 flex gap-3">
                                    <button type="submit" id="msgSubmitBtn" class="flex-1 bg-blue-600 text-white font-medium p-2.5 rounded-lg hover:bg-blue-700 transition flex justify-center items-center gap-2 shadow-sm">
                                        <i data-lucide="send" class="w-5 h-5"></i> إرسال
                                    </button>
                                    <button type="button" onclick="closeSendMessageModal()" class="flex-1 bg-gray-100 text-gray-700 font-medium p-2.5 rounded-lg hover:bg-gray-200 transition">
                                        إلغاء
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.loadMessages = async function(tab) {
            window.currentMessagesTab = tab;
            
            // Update tabs UI
            const tabInbox = document.getElementById('tab-inbox');
            const tabSent = document.getElementById('tab-sent');
            if (tabInbox && tabSent) {
                if (tab === 'inbox') {
                    tabInbox.className = 'flex-1 py-3 text-center font-medium border-b-2 border-blue-600 text-blue-600 transition';
                    tabSent.className = 'flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition border-b-2 border-transparent';
                } else {
                    tabSent.className = 'flex-1 py-3 text-center font-medium border-b-2 border-blue-600 text-blue-600 transition';
                    tabInbox.className = 'flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition border-b-2 border-transparent';
                }
            }

            const listEl = document.getElementById('messagesList');
            if (!listEl) return;
            listEl.innerHTML = '<div class="p-8 text-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> جاري تحميل الرسائل...</div>';
            if (window.lucide) lucide.createIcons();

            try {
                let query = supabaseClient.from('messages').select(`
                    id, subject, content, is_read, created_at,
                    sender:sender_id(id, full_name, role),
                    receiver:receiver_id(id, full_name, role)
                `).order('created_at', { ascending: false });

                if (tab === 'inbox') {
                    query = query.eq('receiver_id', currentUser.id);
                } else {
                    query = query.eq('sender_id', currentUser.id);
                }

                const { data, error } = await query;
                if (error) throw error;
                
                window.messagesData = data || [];
                renderMessagesList();
            } catch (err) {
                console.error("Error loading messages:", err);
                listEl.innerHTML = `<div class="p-8 text-center text-red-500">حدث خطأ أثناء تحميل الرسائل: ${err.message}</div>`;
            }
        };

        function renderMessagesList() {
            const listEl = document.getElementById('messagesList');
            if (!listEl) return;
            
            if (window.messagesData.length === 0) {
                listEl.innerHTML = '<div class="p-8 text-center text-gray-500">لا توجد رسائل.</div>';
                return;
            }

            let html = '';
            window.messagesData.forEach(msg => {
                const isUnread = (window.currentMessagesTab === 'inbox' && !msg.is_read);
                const bgClass = isUnread ? 'bg-red-50/30' : 'bg-white hover:bg-gray-50';
                const fontClass = isUnread ? 'font-bold text-gray-900' : 'font-medium text-gray-700';
                
                const otherParty = window.currentMessagesTab === 'inbox' ? msg.sender?.full_name : msg.receiver?.full_name;
                const roleLabel = (window.currentMessagesTab === 'inbox' ? msg.sender?.role : msg.receiver?.role) === 'admin' ? 'الإدارة' : 'أستاذ';
                
                // Try to extract type if subject starts with [Type]
                let badgeHtml = '';
                let displaySubject = msg.subject;
                if (displaySubject && displaySubject.startsWith('[')) {
                    const closeBracketIdx = displaySubject.indexOf(']');
                    if (closeBracketIdx > 0) {
                        const typeStr = displaySubject.substring(1, closeBracketIdx);
                        displaySubject = displaySubject.substring(closeBracketIdx + 1).trim();
                        
                        let badgeColor = 'bg-gray-100 text-gray-700';
                        if (typeStr.includes('تبليغ')) badgeColor = 'bg-red-100 text-red-700';
                        else if (typeStr.includes('طلب')) badgeColor = 'bg-purple-100 text-purple-700';
                        else if (typeStr.includes('توجيه')) badgeColor = 'bg-blue-100 text-blue-700';
                        
                        badgeHtml = `<span class="inline-block px-2 py-0.5 rounded text-xs font-medium ${badgeColor} ml-2">${typeStr}</span>`;
                    }
                }

                const dateStr = new Date(msg.created_at).toLocaleString('ar-DZ', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                html += `
                    <div class="p-4 border-b border-gray-100 transition cursor-pointer ${bgClass}" onclick="openMessage('${msg.id}')">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-full bg-gray-200 flex-shrink-0 flex items-center justify-center text-gray-600 font-bold">
                                ${(otherParty ? otherParty.charAt(0) : '?')}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-baseline mb-1">
                                    <h4 class="text-sm text-gray-900 font-bold truncate">${window.currentMessagesTab === 'inbox' ? 'من:' : 'إلى:'} ${otherParty} <span class="text-xs text-gray-500 font-normal">(${roleLabel})</span></h4>
                                    <span class="text-xs text-gray-500 whitespace-nowrap mr-2">${dateStr}</span>
                                </div>
                                <h3 class="text-base ${fontClass} truncate mb-1">${badgeHtml} ${displaySubject || 'بدون موضوع'}</h3>
                                <p class="text-sm text-gray-500 truncate">${msg.content || ''}</p>
                            </div>
                            ${isUnread ? '<div class="w-5 h-5 bg-red-500 text-white rounded-full flex-shrink-0 mt-2 flex items-center justify-center text-[10px] font-bold shadow-sm">جديد</div>' : ''}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        window.openMessage = async function(id) {
            const msg = window.messagesData.find(m => m.id === id);
            if (!msg) return;

            // Mark as read if in inbox and unread
            if (window.currentMessagesTab === 'inbox' && !msg.is_read) {
                msg.is_read = true;
                renderMessagesList(); // update UI immediately
                supabaseClient.from('messages').update({ is_read: true }).eq('id', id).then(() => {
                    if (window.updateUnreadMessagesCount) window.updateUnreadMessagesCount();
                });
            }

            const otherParty = window.currentMessagesTab === 'inbox' ? msg.sender?.full_name : msg.receiver?.full_name;
            const roleLabel = (window.currentMessagesTab === 'inbox' ? msg.sender?.role : msg.receiver?.role) === 'admin' ? 'الإدارة' : 'أستاذ';
            const dateStr = new Date(msg.created_at).toLocaleString('ar-DZ', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            // Create a modal to show full message
            const existingModal = document.getElementById('readMessageModal');
            if (existingModal) existingModal.remove();

            const modalHtml = `
                <div id="readMessageModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50">
                            <h3 class="text-lg font-bold text-gray-800">عرض الرسالة</h3>
                            <button onclick="document.getElementById('readMessageModal').remove()" class="text-gray-400 hover:text-gray-600 transition p-1 rounded-md hover:bg-gray-200">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="p-6 overflow-y-auto">
                            <div class="flex items-center gap-4 mb-6 border-b border-gray-100 pb-4">
                                <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-lg">
                                    ${(otherParty ? otherParty.charAt(0) : '?')}
                                </div>
                                <div>
                                    <div class="font-bold text-gray-900">${window.currentMessagesTab === 'inbox' ? 'من:' : 'إلى:'} ${otherParty}</div>
                                    <div class="text-sm text-gray-500">${roleLabel} • ${dateStr}</div>
                                </div>
                            </div>
                            <h2 class="text-xl font-bold text-gray-800 mb-4">${msg.subject}</h2>
                            <div class="text-gray-700 whitespace-pre-wrap leading-relaxed text-base">${msg.content}</div>
                        </div>
                        <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end">
                            <button onclick="document.getElementById('readMessageModal').remove()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition font-medium">إغلاق</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            if (window.lucide) lucide.createIcons();
        };

        window.showSendMessageModal = async function() {
            document.getElementById('sendMessageModal').classList.remove('hidden');
            document.getElementById('sendMessageForm').reset();
            handleMsgTypeChange();

            // Load receivers
            const receiverSelect = document.getElementById('msgReceiver');
            receiverSelect.innerHTML = '<option value="">جاري التحميل...</option>';
            
            try {
                let query = supabaseClient.from('profiles').select('id, full_name, role');
                if (userProfile.role === 'admin') {
                    // Admin sends to teachers
                    query = query.eq('role', 'teacher');
                } else {
                    // Teacher sends to admins
                    query = query.eq('role', 'admin');
                }

                const { data, error } = await query;
                if (error) throw error;

                if (data && data.length > 0) {
                    receiverSelect.innerHTML = '<option value="">اختر المستلم...</option>' + data.map(u => 
                        `<option value="${u.id}">${u.full_name} (${u.role === 'admin' ? 'الإدارة' : 'أستاذ'})</option>`
                    ).join('');
                } else {
                    receiverSelect.innerHTML = '<option value="">لا يوجد مستخدمين متاحين</option>';
                }
            } catch (err) {
                console.error("Error loading receivers:", err);
                receiverSelect.innerHTML = '<option value="">خطأ في التحميل</option>';
            }
        };

        window.closeSendMessageModal = function() {
            document.getElementById('sendMessageModal').classList.add('hidden');
        };

        window.handleMsgTypeChange = async function() {
            const typeSelect = document.getElementById('msgType');
            const studentContainer = document.getElementById('msgStudentContainer');
            const studentSelect = document.getElementById('msgStudent');

            if (typeSelect.value === 'تبليغ عن طالب') {
                studentContainer.classList.remove('hidden');
                studentSelect.required = true;
                
                // Load teacher's students if they are a teacher
                if (userProfile.role === 'teacher') {
                    studentSelect.innerHTML = '<option value="">جاري التحميل...</option>';
                    try {
                        const { data, error } = await supabaseClient.from('students').select('id, first_name, last_name, group_name').match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) });
                        if (error) throw error;
                        
                        if (data && data.length > 0) {
                            studentSelect.innerHTML = '<option value="">اختر الطالب...</option>' + data.map(s => 
                                `<option value="${s.first_name} ${s.last_name}">${s.first_name} ${s.last_name} (${s.group_name})</option>`
                            ).join('');
                        } else {
                            studentSelect.innerHTML = '<option value="">لا يوجد طلاب لديك</option>';
                        }
                    } catch (err) {
                        studentSelect.innerHTML = '<option value="">خطأ في التحميل</option>';
                    }
                } else {
                    // Admin might report on any student, or we can just make them type it, 
                    // for simplicity let's load all students for admin
                    studentSelect.innerHTML = '<option value="">جاري التحميل...</option>';
                    try {
                        const { data, error } = await supabaseClient.from('students').select('id, first_name, last_name, group_name');
                        if (error) throw error;
                        
                        if (data && data.length > 0) {
                            studentSelect.innerHTML = '<option value="">اختر الطالب...</option>' + data.map(s => 
                                `<option value="${s.first_name} ${s.last_name}">${s.first_name} ${s.last_name} (${s.group_name})</option>`
                            ).join('');
                        } else {
                            studentSelect.innerHTML = '<option value="">لا يوجد طلاب</option>';
                        }
                    } catch (err) {
                        studentSelect.innerHTML = '<option value="">خطأ في التحميل</option>';
                    }
                }
            } else {
                studentContainer.classList.add('hidden');
                studentSelect.required = false;
            }
        };

        window.sendNewMessage = async function(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('msgSubmitBtn');
            const originalText = submitBtn.innerHTML;
            
            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> جاري الإرسال...';
                if (window.lucide) lucide.createIcons();

                const receiver_id = SecurityHelper.sanitizeText(document.getElementById('msgReceiver').value);
                const type = SecurityHelper.sanitizeText(document.getElementById('msgType').value);
                const rawSubject = SecurityHelper.sanitizeText(document.getElementById('msgSubject').value);
                const content = SecurityHelper.sanitizeText(document.getElementById('msgContent').value);
                
                let subject = `[${type}] ${rawSubject}`;
                
                if (type === 'تبليغ عن طالب') {
                    const studentName = document.getElementById('msgStudent').value;
                    if (studentName) {
                        subject = `[${type}: ${studentName}] ${rawSubject}`;
                    }
                }

                const payload = {
                    sender_id: currentUser.id,
                    receiver_id: receiver_id,
                    subject: subject,
                    content: content,
                    is_read: false
                };

                const { error } = await supabaseClient.from('messages').insert([payload]);
                if (error) throw error;

                closeSendMessageModal();
                loadMessages(window.currentMessagesTab);
                alert("تم إرسال الرسالة بنجاح!");
            } catch (err) {
                console.error("Error sending message:", err);
                alert(getFriendlyErrorMessage(err));
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
                if (window.lucide) lucide.createIcons();
            }
        };

        window.updateUnreadMessagesCount = async function() {
            if (!currentUser) return;
            try {
                const { count, error } = await supabaseClient
                    .from('messages')
                    .select('*', { count: 'exact', head: true })
                    .eq('receiver_id', currentUser.id)
                    .eq('is_read', false);
                    
                if (!error) {
                    const badgeElements = document.querySelectorAll('.unread-messages-badge');
                    badgeElements.forEach(el => {
                        if (count > 0) {
                            el.textContent = count;
                            el.classList.remove('hidden');
                        } else {
                            el.classList.add('hidden');
                        }
                    });
                }
            } catch (err) {}
        };

        // Initialize App (will be overridden by auth state change once connection establishes)
        showPage('login');
    </script>
</body>
</html>
