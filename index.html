        async function loadCenterSettings() {
            try {
                const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
                const { data, error } = await supabase.from('center_settings').select('*').limit(1).single();
                if (data) {
                    if (data.current_session) document.getElementById('currentSessionInput').value = data.current_session;
                    if (data.center_name_ar) document.getElementById('centerNameArInput').value = data.center_name_ar;
                    if (data.center_name_fr) document.getElementById('centerNameFrInput').value = data.center_name_fr;
                    if (data.university_name_ar) document.getElementById('univNameArInput').value = data.university_name_ar;
                    if (data.university_name_fr) document.getElementById('univNameFrInput').value = data.university_name_fr;
                    if (data.center_logo_url) document.getElementById('centerLogoInput').value = data.center_logo_url;
                    if (data.university_logo_url) document.getElementById('univLogoInput').value = data.university_logo_url;
                }
                
                // Load active state from localStorage as it might not be in the DB
                const isActive = localStorage.getItem('system_is_active') !== 'false';
                document.getElementById('systemActiveToggle').checked = isActive;

                if (window.lucide) lucide.createIcons();
            } catch (err) {
                console.error("Error loading center settings", err);
            }
        }

        async function saveCenterSettings() {
            if (!confirm('هل أنت متأكد من حفظ وتغيير إعدادات المركز؟')) return;
            
            const btn = document.getElementById('saveSettingsBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> جاري الحفظ...';
            
            const sessionVal = document.getElementById('currentSessionInput').value;
            const payload = {
                current_session: sessionVal,
                center_name_ar: document.getElementById('centerNameArInput').value,
                center_name_fr: document.getElementById('centerNameFrInput').value,
                university_name_ar: document.getElementById('univNameArInput').value,
                university_name_fr: document.getElementById('univNameFrInput').value,
                center_logo_url: document.getElementById('centerLogoInput').value,
                university_logo_url: document.getElementById('univLogoInput').value
            };

            const isActive = document.getElementById('systemActiveToggle').checked;
            localStorage.setItem('system_is_active', isActive);
            
            try {
                const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
                // Get the ID of the first row to update
                const { data: existingData } = await supabase.from('center_settings').select('id').limit(1).single();
                
                let err = null;
                if (existingData && existingData.id) {
                    const { error } = await supabase.from('center_settings').update(payload).eq('id', existingData.id);
                    err = error;
                } else {
                    const { error } = await supabase.from('center_settings').insert([payload]);
                    err = error;
                }
                
                if (err) throw err;
                
                window.currentSession = sessionVal;
                
                // Also update UI titles if needed
                if (payload.center_name_ar) {
                    const brandTitles = document.querySelectorAll('.brand-title');
                    brandTitles.forEach(el => el.textContent = payload.center_name_ar);
                }

                alert('تم حفظ الإعدادات بنجاح!');
            } catch (err) {
                console.error("Error saving center settings", err);
                alert(getFriendlyErrorMessage(typeof err !== "undefined" ? err : e));
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
                if (window.lucide) lucide.createIcons();
            }
        }

        let allTeachersData = [];
        let currentResetEmail = '';

        async function loadUserManagement() {
            const tbody = document.getElementById('userManagementTableBody');
            if (!tbody) return;
            
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
            
            try {
                const { data: teachers, error } = await supabase
                    .from('profiles')
                    .select('id, full_name, email, created_at, account_status')
                    .eq('role', 'teacher')
                    .order('created_at', { ascending: false });
                    
                if (error) throw error;
                
                allTeachersData = teachers || [];
                filterUserManagement();
                
            } catch (error) {
                console.error("Error loading teachers", error);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-500">حدث خطأ أثناء جلب البيانات</td></tr>';
            }
        }

        function filterUserManagement() {
            const tbody = document.getElementById('userManagementTableBody');
            if (!tbody) return;

            const searchQuery = (document.getElementById('teacherSearchInput')?.value || '').toLowerCase();
            const statusFilter = document.getElementById('teacherStatusFilter')?.value || 'all';

            const filtered = allTeachersData.filter(t => {
                const matchesSearch = (t.full_name || '').toLowerCase().includes(searchQuery) || 
                                      (t.email || '').toLowerCase().includes(searchQuery);
                let matchesStatus = true;
                if (statusFilter === 'active') matchesStatus = t.account_status === 'active';
                if (statusFilter === 'suspended') matchesStatus = t.account_status === 'suspended';
                
                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">لا يوجد أساتذة يطابقون البحث.</td></tr>';
                if (window.lucide) lucide.createIcons();
                return;
            }

            tbody.innerHTML = filtered.map(teacher => {
                const date = new Date(teacher.created_at).toLocaleDateString('ar-EG');
                const isActive = teacher.account_status === 'active';
                
                const statusBadge = isActive 
                    ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold">نشط</span>'
                    : '<span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs font-bold">معطل</span>';
                
                const actionBtn = isActive
                    ? `<button onclick="toggleTeacherStatus('${teacher.id}', 'suspended')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg transition text-xs font-medium flex items-center gap-1"><i data-lucide="ban" class="w-3 h-3"></i> تعطيل</button>`
                    : `<button onclick="toggleTeacherStatus('${teacher.id}', 'active')" class="bg-green-50 hover:bg-green-100 text-green-600 px-3 py-1.5 rounded-lg transition text-xs font-medium flex items-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i> تفعيل</button>`;

                return `
                    <tr class="hover:bg-gray-50 transition border-b border-gray-50 last:border-0">
                        <td class="p-4 font-medium text-gray-800">${teacher.full_name || '-'}</td>
                        <td class="p-4 text-gray-600" dir="ltr">${teacher.email || '-'}</td>
                        <td class="p-4 text-gray-600">${date}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 flex gap-2">
                            ${actionBtn}
                            <button onclick="openResetPasswordModal('${teacher.email}', '${teacher.full_name}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg transition text-xs font-medium flex items-center gap-1">
                                <i data-lucide="key" class="w-3 h-3"></i> كلمة المرور
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            if (window.lucide) lucide.createIcons();
        }

        async function toggleTeacherStatus(userId, newStatus) {
            if (!confirm(newStatus === 'active' ? 'هل أنت متأكد من تفعيل حساب هذا الأستاذ؟' : 'هل أنت متأكد من تعطيل حساب هذا الأستاذ؟ لا يمكنه تسجيل الدخول بعد ذلك.')) return;
            
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ account_status: newStatus })
                    .eq('id', userId);
                    
                if (error) throw error;
                
                // Update local array
                const tIndex = allTeachersData.findIndex(t => t.id === userId);
                if (tIndex > -1) {
                    allTeachersData[tIndex].account_status = newStatus;
                    filterUserManagement();
                }
            } catch (err) {
                console.error("Error updating status", err);
                alert(getFriendlyErrorMessage(typeof err !== "undefined" ? err : e));
            }
        }

        function openResetPasswordModal(email, name) {
            currentResetEmail = email;
            document.getElementById('resetModalTeacherName').textContent = name || '-';
            document.getElementById('resetModalTeacherEmail').textContent = email || '-';
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('resetPasswordModal').classList.remove('hidden');
        }

        function closeResetPasswordModal() {
            document.getElementById('resetPasswordModal').classList.add('hidden');
            currentResetEmail = '';
        }

        function generateRandomPassword() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
            let pwd = '';
            for (let i = 0; i < 10; i++) {
                pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('newPasswordInput').value = pwd;
        }

        async function confirmResetPassword() {
            const pwdInput = document.getElementById('newPasswordInput').value;
            if (!pwdInput) {
                alert("الرجاء إدخال كلمة مرور جديدة.");
                return;
            }
            if (!currentResetEmail) return;

            const btn = document.getElementById('confirmResetBtn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> جاري...';

            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;

            try {
                const { data, error } = await supabase.rpc('admin_reset_password', {
                    user_email: currentResetEmail,
                    new_password: pwdInput
                });
                
                if (error) throw error;
                
                alert("تم تغيير كلمة المرور بنجاح.");
                closeResetPasswordModal();
            } catch (err) {
                console.error("Error resetting password", err);
                alert(getFriendlyErrorMessage(err));
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                if (window.lucide) lucide.createIcons();
            }
        }

        async function loadGroupsLevels() {
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
            const select = document.getElementById('teacherSelect');
            if (!select) return;
            
            try {
                const { data: teachers, error } = await supabase
                    .from('profiles')
                    .select('id, full_name')
                    .eq('role', 'teacher')
                    .order('full_name');
                    
                if (error) throw error;
                
                select.innerHTML = '<option value="">اختر الأستاذ...</option>' + 
                    teachers.map(t => `<option value="${t.id}">${t.full_name || 'بدون اسم'}</option>`).join('');
                    
            } catch (err) {
                console.error("Error loading teachers:", err);
                select.innerHTML = '<option value="">خطأ في تحميل الأساتذة</option>';
            }
        }

        window.currentTeacherGroups = {};

        window.loadTeacherGroups = async function(teacherId) {
            const container = document.getElementById('groupsCardsContainer');
            if (!container) return;
            
            if (!teacherId) {
                container.innerHTML = `
                    <div class="col-span-full text-center p-12 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500 text-lg">
                        الرجاء اختيار أستاذ من القائمة أعلاه لعرض الأفواج
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="col-span-full text-center p-12 text-gray-500"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-3"></i> جاري تحميل الأفواج...</div>';
            if (window.lucide) lucide.createIcons();
            
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
            
            try {
                // 1. Fetch normal students
                const { data: students, error: studentsError } = await supabase
                    .from('students')
                    .select('*')
                    .eq('teacher_id', teacherId)
                    .order('created_at', { ascending: false });
                
                if (studentsError) throw studentsError;

                // 2. Fetch agreements for this teacher
                const { data: agreements, error: agrError } = await supabase
                    .from('agreements')
                    .select('*')
                    .eq('teacher_id', teacherId);
                
                if (agrError) throw agrError;

                let trainees = [];
                if (agreements && agreements.length > 0) {
                    const agrIds = agreements.map(a => a.id);
                    // 3. Fetch trainees for these agreements
                    const { data: trData, error: trError } = await supabase
                        .from('agreement_trainees')
                        .select('*, agreements:agreement_id(organization_name)')
                        .in('agreement_id', agrIds)
                        .order('created_at', { ascending: false });
                    
                    if (trError) throw trError;
                    if (trData) trainees = trData;
                }

                if ((!students || students.length === 0) && (!trainees || trainees.length === 0)) {
                    container.innerHTML = `
                        <div class="col-span-full text-center p-12 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500 text-lg">
                            لا توجد أفواج مسجلة لهذا الأستاذ
                        </div>
                    `;
                    return;
                }
                
                // Group normal students
                window.currentTeacherGroups = {};
                (students || []).forEach(s => {
                    const level = s.level || 'مستوى غير محدد';
                    const group = s.group_name || 'فوج غير محدد';
                    const key = `${level}-${group}`;
                    
                    if (!window.currentTeacherGroups[key]) {
                        window.currentTeacherGroups[key] = { type: 'normal', level, group, students: [] };
                    }
                    window.currentTeacherGroups[key].students.push(s);
                });

                // Group agreement trainees separately
                (trainees || []).forEach(t => {
                    const level = t.level || 'مستوى غير محدد';
                    const group = t.group_name || 'فوج غير محدد';
                    const orgName = t.agreements?.organization_name || 'اتفاقية';
                    const key = `agr-${t.agreement_id}-${level}-${group}`;
                    
                    if (!window.currentTeacherGroups[key]) {
                        window.currentTeacherGroups[key] = { type: 'agreement', orgName, level, group, students: [] };
                    }
                    window.currentTeacherGroups[key].students.push({
                        first_name: t.first_name,
                        last_name: t.last_name,
                        birth_date: t.birth_date,
                        location: t.birth_place || '-',
                        isAgreement: true,
                        organization_name: orgName
                    });
                });
                
                const keys = Object.keys(window.currentTeacherGroups).sort();
                let html = '';
                
                keys.forEach((key, index) => {
                    const g = window.currentTeacherGroups[key];
                    const detailsId = `group-details-${index}`;
                    const isAgr = g.type === 'agreement';
                    const iconColor = isAgr ? 'text-emerald-600 bg-emerald-50' : 'text-blue-600 bg-blue-50';
                    const btnColor = isAgr ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700';
                    const badgeColor = isAgr ? 'bg-emerald-500' : 'bg-blue-500';
                    const titleStr = isAgr ? `${g.level} - ${g.group}` : `${g.level} - ${g.group}`;
                    
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col overflow-hidden">
                            <div class="p-6 flex-1 flex flex-col items-center text-center">
                                <div class="w-14 h-14 ${iconColor} rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide="${isAgr ? 'briefcase' : 'layers'}" class="w-7 h-7"></i>
                                </div>

        async function loadCertLevelsGroups() {
            const teacherId = document.getElementById('certTeacher').value;
            const level = document.getElementById('certLevel').value;
            const groupSelect = document.getElementById('certGroup');
            
            // Try to find teacher language
            window.certTeacherLanguage = '';
            if (teacherId) {
                try {
                    const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
                    const selectEl = document.getElementById('certTeacher');
                    const email = selectEl.options[selectEl.selectedIndex].getAttribute('data-email');
                    
                    if (email) {
                        const { data } = await supabase.from('teacher_requests').select('language').eq('email', email).limit(1);
                        if (data && data.length > 0) window.certTeacherLanguage = data[0].language;
                    }
                } catch(e) {}
            }
            
            if (!teacherId || !level) {
                groupSelect.innerHTML = '<option value="">اختر الفوج...</option>';
                groupSelect.disabled = true;
                return;
            }
            
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
            groupSelect.disabled = true;
            groupSelect.innerHTML = '<option value="">جاري التحميل...</option>';
            
            try {
                const { data: groups, error } = await supabase
                    .from('students')
                    .select('group_name')
                    .eq('teacher_id', teacherId)
                    .eq('level', level);
                    
                if (error) throw error;
                
                const uniqueGroups = [...new Set(groups.map(g => g.group_name))].filter(Boolean).sort();
                
                if (uniqueGroups.length > 0) {
                    groupSelect.innerHTML = '<option value="">اختر الفوج...</option>' + 
                        uniqueGroups.map(g => `<option value="${g}">${g}</option>`).join('');
                    groupSelect.disabled = false;
                } else {
                    groupSelect.innerHTML = '<option value="">لا توجد أفواج</option>';
                }
            } catch (err) {
                console.error("Error loading groups:", err);
                groupSelect.innerHTML = '<option value="">خطأ</option>';
            }
        }

        async function generateWordCertificates() {
            if (!window.certStudentsList || window.certStudentsList.length === 0) return;
            
            const level = document.getElementById('certLevel').value;
            const group = document.getElementById('certGroup').value;
            const language = window.certTeacherLanguage || "اللغة الأجنبية";
            
            const tableRows = [
                new docx.TableRow({
                    children: ["الاسم الكامل","تاريخ الميلاد","مكان الميلاد","اللغة","المستوى","المعدل"].map(h =>
                        new docx.TableCell({ 
                            children: [new docx.Paragraph({ text: h, alignment: docx.AlignmentType.CENTER, rightToLeft: true, bold: true })],
                            shading: { fill: "f3f4f6" },
                            margins: { top: 100, bottom: 100, left: 100, right: 100 }
                        })
                    )
                }),
                ...window.certStudentsList.map(item => {
                    const student = item.students || {};
                    const fullName = (student.first_name || "") + " " + (student.last_name || "");
                    const birthDate = student.birth_date ? new Date(student.birth_date).toLocaleDateString('ar-DZ') : "-";
                    const location = student.location || "-";
                    const itemLevel = item.level || level;
                    const moyen = item.moyen != null ? item.moyen.toString() : "-";
                    
                    return new docx.TableRow({
                        children: [
                            fullName,
                            birthDate,
                            location,
                            language,
                            itemLevel,
                            moyen
                        ].map(text => new docx.TableCell({ 
                            children: [new docx.Paragraph({ text, alignment: docx.AlignmentType.CENTER, rightToLeft: true })],
                            margins: { top: 100, bottom: 100, left: 100, right: 100 }
                        }))
                    });
                })
            ];

            const doc = new docx.Document({
                sections: [{
                    properties: {
                        page: {
                            margin: { top: 1000, right: 1000, bottom: 1000, left: 1000 }
                        }
                    },
                    children: [
                        new docx.Paragraph({ 
                            text: "قائمة الناجحين", 
                            alignment: docx.AlignmentType.CENTER, 
                            bold: true, 
                            size: 32,
                            rightToLeft: true,
                            spacing: { after: 200 }
                        }),
                        new docx.Paragraph({ 
                            text: new Date().toLocaleDateString('ar-DZ'), 
                            alignment: docx.AlignmentType.CENTER,
                            rightToLeft: true,
                            spacing: { after: 400 }
                        }),
                        new docx.Table({
                            rows: tableRows,
                            width: { size: 100, type: docx.WidthType.PERCENTAGE }
                        })
                    ]
                }]
            });

            const blob = await docx.Packer.toBlob(doc);
            window.saveAs(blob, `قائمة_الناجحين_${level}_${group}.doc`);
        }

        async function loadReportsData() {
            const loader = document.getElementById('reportsLoader');
            const content = document.getElementById('reportsContent');
            if (!loader || !content) return;
            
            loader.classList.remove('hidden');
            loader.classList.add('flex');
            content.classList.add('hidden');
            
            try {
                const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
                
                // 1. Students Report
                
                const teacherFilter = document.getElementById('reportsTeacherFilter')?.value;
                const levelFilter = document.getElementById('reportsLevelFilter')?.value;
                const groupFilter = document.getElementById('reportsGroupFilter')?.value;

                let studentsQuery = supabase.from('students').select('*, profiles:teacher_id(full_name)');
                let attendanceQuery = supabase.from('attendance').select('*');
                let gradesQuery = supabase.from('student_grades').select('*, profiles:teacher_id(full_name)');
                if (window.currentSession) {
                    studentsQuery = studentsQuery.eq('session', window.currentSession);
                    attendanceQuery = attendanceQuery.eq('session', window.currentSession);
                    gradesQuery = gradesQuery.eq('session', window.currentSession);
                }
                
                if (teacherFilter) {
                    studentsQuery = studentsQuery.eq('teacher_id', teacherFilter);
                    attendanceQuery = attendanceQuery.eq('teacher_id', teacherFilter);
                    gradesQuery = gradesQuery.eq('teacher_id', teacherFilter);
                }
                if (levelFilter) {
                    studentsQuery = studentsQuery.eq('level', levelFilter);
                    attendanceQuery = attendanceQuery.eq('level', levelFilter);
                    gradesQuery = gradesQuery.eq('level', levelFilter);
                }
                if (groupFilter) {
                    studentsQuery = studentsQuery.eq('group_name', groupFilter);
                    attendanceQuery = attendanceQuery.eq('group_name', groupFilter);
                    gradesQuery = gradesQuery.eq('group_name', groupFilter);
                }
                
                const [
                    { data: students },
                    { data: attendance },
                    { data: grades }
                ] = await Promise.all([
                    studentsQuery,
                    attendanceQuery,
                    gradesQuery
                ]);

                if (students) {
                    const totalStudents = students.length;
                    const byLang = {};
                    const byLevel = {};
                    const byGroup = {};
                    
                    students.forEach(s => {
                        const lang = s.language || 'غير محدد';
                        const lvl = s.level || 'غير محدد';
                        const grp = s.group_name || 'غير محدد';
                        const uniqueGrp = lvl + '|||' + grp;
                        
                        byLang[lang] = (byLang[lang] || 0) + 1;
                        byLevel[lvl] = (byLevel[lvl] || 0) + 1;
                        byGroup[uniqueGrp] = (byGroup[uniqueGrp] || 0) + 1;
                    });
                    
                    document.getElementById('studentsStatsCards').innerHTML = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">إجمالي الطلاب</p>
                            <h3 class="text-3xl font-bold text-blue-600">${totalStudents}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">عدد اللغات</p>
                            <h3 class="text-3xl font-bold text-indigo-600">${Object.keys(byLang).length}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">عدد المستويات</p>
                            <h3 class="text-3xl font-bold text-green-600">${Object.keys(byLevel).length}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">عدد الأفواج</p>
                            <h3 class="text-3xl font-bold text-purple-600">${Object.keys(byGroup).length}</h3>
                        </div>
                    `;
                    
                    const teachersMap = {};
                    students.forEach(s => {
                        const tId = s.teacher_id || 'unknown';
                        const tName = s.profiles?.full_name || 'أستاذ غير محدد';
                        const lvl = s.level || 'غير محدد';
                        const grp = s.group_name || 'غير محدد';
                        
                        if (!teachersMap[tId]) {
                            teachersMap[tId] = { name: tName, levels: {} };
                        }
                        if (!teachersMap[tId].levels[lvl]) {
                            teachersMap[tId].levels[lvl] = { groups: {} };
                        }
                        if (!teachersMap[tId].levels[lvl].groups[grp]) {
                            teachersMap[tId].levels[lvl].groups[grp] = [];
                        }
                        teachersMap[tId].levels[lvl].groups[grp].push(s);
                    });

                    let reportHTML = `<div class="space-y-6">`;
                    Object.values(teachersMap).forEach(teacher => {

                        Object.entries(teacher.levels).forEach(([lvlName, lvlObj]) => {
                            let groupsHTML = '';
                            Object.entries(lvlObj.groups).forEach(([grpName, studentsArr]) => {

                                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-100 mb-2 hover:bg-gray-100 transition">
                                        <span class="text-gray-700 font-medium">${grpName}</span>
                                        <span class="bg-blue-100 text-blue-700 py-1 px-3 rounded-full text-xs font-bold">${studentsArr.length} طالب(ة)</span>
                                    </div>
                                `;
                            });
                            levelsHTML += `
                                <div class="mb-5 last:mb-0">
                                    <h4 class="text-md font-bold text-gray-800 mb-3 flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 block"></span>
                                        مستوى ${lvlName}
                                    </h4>
                                    <div class="pr-4 border-r-2 border-gray-100">
                                        ${groupsHTML}
                                    </div>
                                </div>
                            `;
                        });
                        
                        let totalGroups = 0;
                        let totalStds = 0;
                        Object.values(teacher.levels).forEach(l => {
                            Object.values(l.groups).forEach(g => {
                                totalGroups++;
                                totalStds += g.length;
                            });
                        });

                        reportHTML += `
                            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                <div class="bg-gray-50 p-4 border-b border-gray-200 flex items-center justify-between flex-wrap gap-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-white border border-gray-200 text-blue-600 flex items-center justify-center shrink-0 shadow-sm">
                                            <i data-lucide="user" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-gray-900">${teacher.name}</h3>
                                            <p class="text-xs text-gray-500">${Object.keys(teacher.levels).length} مستويات • ${totalGroups} أفواج</p>
                                        </div>
                                    </div>
                                    <div class="bg-blue-600 text-white py-1.5 px-4 rounded-full text-sm font-bold shadow-sm">
                                        إجمالي: ${totalStds} طالب
                                    </div>
                                </div>
                                <div class="p-5">
                                    ${levelsHTML}
                                </div>
                            </div>
                        `;
                    });
                    reportHTML += `</div>`;
                    document.getElementById('studentsTableContainer').innerHTML = reportHTML;
                    
                    if (totalStudents > 0) {
                        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#64748b'];
                        let conicStr = [];
                        let currentDeg = 0;
                        let legendHTML = '<div class="mt-4 w-full flex flex-wrap gap-3 justify-center">';
                        let i = 0;
                        Object.entries(byLang).forEach(([lang, count]) => {
                            const pct = (count / totalStudents) * 100;
                            const deg = (pct / 100) * 360;
                            const color = colors[i % colors.length];
                            conicStr.push(`${color} ${currentDeg}deg ${currentDeg + deg}deg`);
                            currentDeg += deg;
                            legendHTML += `<div class="flex items-center gap-1 text-xs"><span class="w-3 h-3 rounded-full block" style="background:${color}"></span>${lang} (${count})</div>`;
                            i++;
                        });
                        legendHTML += '</div>';
                        document.getElementById('studentsChartContainer').innerHTML = `
                            <div class="w-40 h-40 rounded-full" style="background: conic-gradient(${conicStr.join(', ')})"></div>
                            ${legendHTML}
                        `;
                    } else {
                        document.getElementById('studentsChartContainer').innerHTML = '<p class="text-gray-400">لا توجد بيانات</p>';
                    }
                }

                // 2. Attendance Report
                
                if (attendance) {
                    const totalRecords = attendance.length;
                    const present = attendance.filter(a => a.status === 'present').length;
                    const absent = attendance.filter(a => a.status === 'absent').length;
                    const withdrawn = attendance.filter(a => a.status === 'withdrawn').length;
                    
                    document.getElementById('attendanceStatsCards').innerHTML = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">إجمالي السجلات</p>

                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">حاضر</p>
                            <h3 class="text-3xl font-bold text-green-600">${present}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">غائب</p>
                            <h3 class="text-3xl font-bold text-red-600">${absent}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">متخلي</p>
                            <h3 class="text-3xl font-bold text-orange-500">${withdrawn}</h3>
                        </div>
                    `;
                    
                    const groupAtt = {};
                    attendance.forEach(a => {
                        const l = a.level || '';
                        const g = a.group_name || 'غير محدد';
                        const uniqueG = l ? (l + ' - ' + g) : g;
                        if(!groupAtt[uniqueG]) groupAtt[uniqueG] = { total: 0, present: 0 };
                        groupAtt[uniqueG].total++;
                        if(a.status === 'present') groupAtt[uniqueG].present++;
                    });
                    
                    let barsHTML = '';
                    Object.entries(groupAtt).forEach(([g, stats]) => {
                        const pct = Math.round((stats.present / stats.total) * 100) || 0;
                        barsHTML += `
                            <div class="flex flex-col items-center flex-1 min-w-[40px] group">
                                <span class="text-xs text-gray-500 mb-1 opacity-0 group-hover:opacity-100 transition">${pct}%</span>
                                <div class="w-full max-w-[40px] bg-blue-100 rounded-t-sm relative h-48 flex items-end">
                                    <div class="w-full bg-blue-500 rounded-t-sm transition-all duration-500" style="height: ${pct}%"></div>
                                </div>
                                <span class="text-xs text-gray-600 mt-2 truncate max-w-full" title="${g}">${g}</span>
                            </div>
                        `;
                    });
                    document.getElementById('attendanceChartContainer').innerHTML = barsHTML || '<p class="text-gray-400 w-full text-center">لا توجد بيانات</p>';
                }

                // 3. Results Report
                
                if (grades) {
                    const totalExams = grades.length;
                    const passed = grades.filter(g => g.decision === 'admis' && g.moyen >= 10).length;
                    const failed = grades.filter(g => g.decision === 'ajournée' || g.moyen < 10).length;
                    
                    document.getElementById('resultsStatsCards').innerHTML = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">إجمالي الامتحانات المسجلة</p>
                            <h3 class="text-3xl font-bold text-gray-800">${totalExams}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">الناجحين</p>
                            <h3 class="text-3xl font-bold text-green-600">${passed}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium mb-1">الراسبين</p>
                            <h3 class="text-3xl font-bold text-red-600">${failed}</h3>
                        </div>
                    `;
                    
                    const teacherStats = {};
                    grades.forEach(g => {
                        const tName = g.profiles?.full_name || 'غير محدد';
                        if(!teacherStats[tName]) teacherStats[tName] = { total: 0, passed: 0 };
                        teacherStats[tName].total++;
                        if(g.decision === 'admis' && g.moyen >= 10) teacherStats[tName].passed++;
                    });
                    
                    let rTableHTML = `<table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-600 border-b"><tr><th class="px-4 py-3">الأستاذ</th><th class="px-4 py-3">الامتحانات</th><th class="px-4 py-3">نسبة النجاح</th></tr></thead><tbody class="divide-y divide-gray-100">`;
                    Object.entries(teacherStats).forEach(([t, s]) => {
                        const pct = Math.round((s.passed / s.total) * 100) || 0;
                        rTableHTML += `<tr><td class="px-4 py-3 font-medium">${t}</td><td class="px-4 py-3 text-gray-600">${s.total}</td><td class="px-4 py-3 text-green-600 font-bold">${pct}%</td></tr>`;
                    });
                    rTableHTML += `</tbody></table>`;
                    document.getElementById('resultsTableContainer').innerHTML = rTableHTML;
                    
                    if (totalExams > 0) {
                        const passPct = (passed / totalExams) * 100;
                        const failPct = (failed / totalExams) * 100;
                        const passDeg = (passPct / 100) * 360;
                        document.getElementById('resultsChartContainer').innerHTML = `
                            <div class="w-40 h-40 rounded-full" style="background: conic-gradient(#10b981 0deg ${passDeg}deg, #ef4444 ${passDeg}deg 360deg)"></div>
                            <div class="mt-4 flex gap-4">
                                <div class="flex items-center gap-1 text-sm"><span class="w-3 h-3 rounded-full bg-green-500 block"></span>ناجح (${Math.round(passPct)}%)</div>
                                <div class="flex items-center gap-1 text-sm"><span class="w-3 h-3 rounded-full bg-red-500 block"></span>راسب (${Math.round(failPct)}%)</div>
                            </div>
                        `;
                    } else {
                        document.getElementById('resultsChartContainer').innerHTML = '<p class="text-gray-400">لا توجد بيانات</p>';
                    }
                }
                
            } catch (err) {

                loader.classList.add('hidden');
                loader.classList.remove('flex');
                content.classList.remove('hidden');
                if (window.lucide) lucide.createIcons();
            }
        }

        // --- Logic ---
        function switchAgreementTab(tabId) {
            currentAgreementTab = tabId;
            document.querySelectorAll('.agreement-tab-content').forEach(el => el.classList.add('hidden'));
            const targetContent = document.getElementById('tabContent_' + tabId);
            if(targetContent) targetContent.classList.remove('hidden');

            document.querySelectorAll('[id^="tabBtn_"]').forEach(el => {
                el.className = 'px-4 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium transition whitespace-nowrap';
            });
            const activeBtn = document.getElementById('tabBtn_' + tabId);
            if(activeBtn) activeBtn.className = 'px-4 py-2 border-b-2 font-medium transition text-blue-600 border-blue-600 whitespace-nowrap';

            if (tabId === 'agreements') {
                document.getElementById('agreementSelectorContainer').classList.add('hidden');
                loadAgreementsTab();
            } else {
                document.getElementById('agreementSelectorContainer').classList.remove('hidden');
                refreshGlobalAgreementSelect();
                onAgreementChanged();
            }
        }

        function refreshGlobalAgreementSelect() {
            const select = document.getElementById('globalAgreementSelect');
            if(!select) return;
            select.innerHTML = '<option value="">-- اختر الاتفاقية أولاً --</option>' + 
                currentAgreementsList.map(a => `<option value="${a.id}" ${a.id === selectedAgreementId ? 'selected' : ''}>${a.organization_name} - ${a.language}</option>`).join('');
        }

        function onAgreementChanged() {
            selectedAgreementId = document.getElementById('globalAgreementSelect')?.value || '';
            if (!selectedAgreementId) {
                document.getElementById('traineesTableBody').innerHTML = '<tr><td colspan="6" class="text-center p-8 text-gray-500">الرجاء اختيار اتفاقية</td></tr>';
                document.getElementById('agreementLessonsListContainer').innerHTML = '<div class="col-span-2 text-center p-8 text-gray-500">الرجاء اختيار اتفاقية</div>';
                document.getElementById('attendanceTableBody').innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">الرجاء اختيار اتفاقية</td></tr>';
                document.getElementById('gradesTableBody').innerHTML = '<tr><td colspan="8" class="text-center p-8 text-gray-500">الرجاء اختيار اتفاقية</td></tr>';
                return;
            }
            if (currentAgreementTab === 'trainees') loadTraineesTab();
            else if (currentAgreementTab === 'lessons') loadLessonsTab();
            else if (currentAgreementTab === 'attendance') loadAttendanceTab();
            else if (currentAgreementTab === 'grades') loadGradesTab();
        }

        function manageTraineesForAgreement(id) {
            selectedAgreementId = id;
            switchAgreementTab('trainees');
        }

        async function loadAgreementsTab() {
            if(!userProfile) return;
            const container = document.getElementById('agreementsListContainer');
            container.innerHTML = '<div class="col-span-full text-center p-8 text-gray-500">جاري التحميل...</div>';
            try {
                const { data: agreements, error } = await supabaseClient
                    .from('agreements')
                    .select('*')
                    .eq('teacher_id', currentUser.id)
                    .order('created_at', { ascending: false });
                
                if (error && error.code !== '42P01') throw error;
                currentAgreementsList = agreements || [];
                
                if (currentAgreementsList.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center p-8 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-200">لا توجد اتفاقيات حالياً. أضف اتفاقية جديدة للبدء.</div>';
                    return;
                }
                
                container.innerHTML = currentAgreementsList.map(a => `
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-3">
                            <h4 class="font-bold text-lg text-gray-800">${a.organization_name}</h4>
                            <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-bold">${a.language}</span>
                        </div>
                        <div class="space-y-2 text-sm text-gray-600 mb-4">
                            <p class="flex items-center gap-2"><i data-lucide="user" class="w-4 h-4"></i> ${a.contact_person || '-'} (${a.contact_phone || '-'})</p>
                            <p class="flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> ${a.start_date} إلى ${a.end_date}</p>
                            <p class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4"></i> ${a.total_hours} ساعة</p>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-gray-50">
                            <button onclick="manageTraineesForAgreement('${a.id}')" class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-medium transition">إدارة المتدربين</button>
                            <button onclick="deleteAgreement('${a.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 p-2 rounded-lg transition" title="حذف"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `).join('');
                if (window.lucide) lucide.createIcons();
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="col-span-full text-center p-4 text-red-500">حدث خطأ. قد لا تكون الجداول مهيأة.</div>';
            }
        }

        function openNewAgreementModal() { document.getElementById('newAgreementModal').classList.remove('hidden'); }
        function closeNewAgreementModal() { document.getElementById('newAgreementModal').classList.add('hidden'); }

        async function saveAgreement() {
            const data = {
                teacher_id: currentUser.id,
                organization_name: document.getElementById('agr_org_name').value,
                contact_person: document.getElementById('agr_contact_person').value,
                contact_phone: document.getElementById('agr_contact_phone').value,
                start_date: document.getElementById('agr_start_date').value,
                end_date: document.getElementById('agr_end_date').value,
                total_hours: parseInt(document.getElementById('agr_total_hours').value) || 0,
                language: document.getElementById('agr_language').value,
                notes: document.getElementById('agr_notes').value
            };
            if(!data.organization_name) return alert('اسم الجهة مطلوب');
            
            try {
                await supabaseClient.from('agreements').insert([data]);
                closeNewAgreementModal();
                loadAgreementsTab();
            } catch(e) {
                console.error(e); alert(getFriendlyErrorMessage(e));
            }
        }

        async function deleteAgreement(id) {
            if(!confirm('هل أنت متأكد من حذف هذه الاتفاقية وكل بياناتها؟')) return;
            try {
                await supabaseClient.from('agreements').delete().eq('id', id);
                loadAgreementsTab();
            } catch(e) {
                console.error(e);
            }
        }

        function openNewTraineeModal() { document.getElementById('newTraineeModal').classList.remove('hidden'); }
        function closeNewTraineeModal() { document.getElementById('newTraineeModal').classList.add('hidden'); }

        async function loadTraineesTab() {
            const tbody = document.getElementById('traineesTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8">جاري التحميل...</td></tr>';
            try {
                const { data, error } = await supabaseClient
                    .from('agreement_trainees')
                    .select('*')
                    .eq('agreement_id', selectedAgreementId)
                    .order('level').order('group_name').order('last_name');
                if (error && error.code !== '42P01') throw error;
                currentTraineesList = data || [];
                
                if (currentTraineesList.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-gray-500">لا يوجد متدربون.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = currentTraineesList.map((t, idx) => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3">${idx + 1}</td>
                        <td class="p-3 font-medium">${t.first_name} ${t.last_name}</td>
                        <td class="p-3"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-bold">${t.level || '-'}</span></td>
                        <td class="p-3">${t.group_name || '-'}</td>
                        <td class="p-3 text-gray-500">${t.birth_date || '-'}</td>
                        <td class="p-3">
                            <button onclick="deleteTrainee('${t.id}')" class="text-red-500 hover:bg-red-50 p-1 rounded transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `).join('');
                if(window.lucide) lucide.createIcons();
            } catch(e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-red-500">خطأ في الجلب</td></tr>';
            }
        }

        async function saveTrainee() {

        function calcAvg(id) {
            const row = document.querySelector(`tr[data-trainee-id="${id}"]`);
            if(!row) return;
            const w = parseFloat(row.querySelector('.grade-written').value) || 0;
            const o = parseFloat(row.querySelector('.grade-oral').value) || 0;
            const p = parseFloat(row.querySelector('.grade-part').value) || 0;
            const avg = ((w + o + p) / 3).toFixed(2);
            row.querySelector(`#avg_${id}`).innerText = avg;
            const decEl = row.querySelector(`#decision_${id}`);
            if (avg >= 10) {
                decEl.innerText = 'Admis';
                decEl.className = 'p-3 font-bold text-green-600';
            } else {
                decEl.innerText = 'Adjournée';
                decEl.className = 'p-3 font-bold text-red-600';
            }
        }

                    const isName = cIdx === 1;
                    const align = isName ? 'text-align: right;' : 'text-align: center;';

                    const pNum = parseFloat(p) || 0;
                    const avg = ((wNum + oNum + pNum) / 3).toFixed(2);
                    
                    const isAdmis = parseFloat(avg) >= 10;
                    if(isAdmis) admisCount++; else ajourneCount++;
                    const decText = isAdmis ? 'ناجح (Admis)' : 'مؤجل (Ajourné)';
                    const decColor = isAdmis ? '#16a34a' : '#dc2626';

                    return [
                        (idx + 1).toString(),
                        `${t.first_name || ''} ${t.last_name || ''}`.trim(),
                        t.level || '-',
                        w,
                        o,
                        p,
                        `<strong>${avg}</strong>`,
                        `<span style="color: ${decColor}; font-weight: bold;">${decText}</span>`
                    ];
                });

                const successRate = trainees.length > 0 ? ((admisCount / trainees.length) * 100).toFixed(1) : 0;
                const summary = `المجموع الكلي: ${trainees.length} | الناجحون: ${admisCount} | المؤجلون: ${ajourneCount} | نسبة النجاح العامة: %${successRate}`;

                downloadDocFile(filename, docTitle, metaRows, headers, tableRows, summary, {
                    right: 'توقيع الأستاذ الممتحن',
                    left: 'ختم وتوقيع رئيس المركز ولجنة المداولات'
                });
            }
        }

        async function updateRequestStatus(id, newStatus) {
            const supabase = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabaseClient;
            try {
                if (newStatus === 'approved') {
                    // Fetch request details (we need the email for the alert)
                    const { data: request, error: fetchReqErr } = await supabase
                        .from('teacher_requests')
                        .select('*')
                        .eq('id', id)
                        .single();
                        
                    if (fetchReqErr || !request) {
                        throw new Error('لا يمكن العثور على بيانات الطلب.');
                    }

                    const password = Math.random().toString(36).slice(-8) + 'A1!';
                   
                    // 1. إنشاء الحساب (التريجر ينشئ profile تلقائياً)
                    const { error } = await supabase.auth.signUp({
                        email: request.email,
                        password: password,
                        options: {
                            data: {
                                full_name: request.full_name,
                                role: 'teacher'
                            }
                        }
                    });
                    
                    if (error) throw error;
                    
                    // 2. حدّث حالة الطلب فقط
                    await supabase.from('teacher_requests')
                        .update({ 
                            status: 'approved', 
                            admin_notes: `كلمة المرور: ${password}` 
                        })
                        .eq('id', request.id);
                   
                    alert(`تم إنشاء الحساب!\nالبريد: ${request.email}\nكلمة المرور: ${password}`);
                } else {
                    // If rejected or other status, just update the status directly
                    const { error: updateError } = await supabase
                        .from('teacher_requests')
                        .update({ status: newStatus })
                        .eq('id', id);

                    if (updateError) throw updateError;
                }

                loadTeacherRequests();
                if (typeof loadAdminDashboardData === 'function') loadAdminDashboardData();
            } catch (error) {
                console.error('Error updating status:', error);
                alert(getFriendlyErrorMessage(error));
            }
        }

        async function loadStudents() {
            if (!currentUser) return;
            const tbody = document.getElementById('studentsTableBody');
            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select(`*, profiles:teacher_id(full_name), agreements:agreement_id(organization_name)`)
                    .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                    .order('created_at', { ascending: false });

                if (error) throw error;
                studentsData = data || [];
                
                // Populate groups filter
                const groups = [...new Set(studentsData.map(s => s.group_name).filter(Boolean))];
                const groupSelect = document.getElementById('groupFilter');
                if (groupSelect) {
                    groupSelect.innerHTML = '<option value="">كل الأفواج</option>' + 
                        groups.map(g => `<option value="${g}">${g}</option>`).join('');
                }
                
                filterStudents();
            } catch (error) {
                console.error('Error loading students:', error);
                if(tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center p-8 text-red-500">حدث خطأ أثناء تحميل البيانات</td></tr>';
            }
        }

        function renderStudentsTable(dataToRender) {
            const tbody = document.getElementById('studentsTableBody');
            if (!tbody) return;
            
            if (dataToRender.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center p-8 text-gray-500">لا يوجد طلاب.</td></tr>';
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = dataToRender.map(student => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4 font-medium text-gray-900">${student.first_name || ''}</td>
                    <td class="p-4 text-gray-700">${student.last_name || ''}</td>
                    <td class="p-4 text-gray-700" dir="ltr">${student.birth_date || '-'}</td>
                    <td class="p-4 text-gray-700">${student.location || '-'}</td>
                    <td class="p-4">

                    </td>

                                <i data-lucide="trash-2" class="w-4 h-4"></i>

            `).join('');

        function filterStudents() {
            const term = (document.getElementById('studentSearch')?.value || '').toLowerCase();
            const level = document.getElementById('levelFilter')?.value || '';
            const group = document.getElementById('groupFilter')?.value || '';

            filteredStudents = studentsData.filter(s => {
                const matchName = ((s.first_name || '') + ' ' + (s.last_name || '')).toLowerCase().includes(term);
                const matchLevel = level ? s.level === level : true;
                const matchGroup = group ? s.group_name === group : true;
                return matchName && matchLevel && matchGroup;
            });

            renderStudentsTable(filteredStudents);
        }

        window.exportStudentsToWord = async function() {
            const btn = document.querySelector('button[onclick="exportStudentsToWord()"]');
            let originalText = '';
            if (btn) {
                originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> جاري التصدير...';
                if (window.lucide) lucide.createIcons();
            }

            try {
                // If studentsData is empty, attempt to load first
                if ((!studentsData || studentsData.length === 0) && currentUser) {
                    const { data } = await supabaseClient
                        .from('students')
                        .select('*')
                        .match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) })
                        .order('created_at', { ascending: false });
                    if (data && data.length > 0) {
                        studentsData = data;
                    }
                }

                const listToExport = (filteredStudents && filteredStudents.length > 0) 
                    ? filteredStudents 
                    : studentsData;

                if (!listToExport || listToExport.length === 0) {
                    alert('لا يوجد طلاب حالياً لتصديرهم.');
                    return;
                }

                // Generate Word Document Content (HTML format compatible with MS Word, Google Docs, WPS)
                const rowsHtml = listToExport.map((s, idx) => `

                const wordHtml = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40' dir='rtl'>
                    <head>

                        <xml>
                        <w:WordDocument>

                            @page Section1 { size:8.5in 11.0in; margin:1.0in 1.0in 1.0in 1.0in; mso-header-margin:.5in; mso-footer-margin:.5in; mso-paper-source:0; }

                        if (document.body.contains(a)) {

                if (student) {
                    document.getElementById('firstName').value = student.first_name || '';
                    document.getElementById('lastName').value = student.last_name || '';
                    document.getElementById('birthDate').value = student.birth_date || '';
                    document.getElementById('location').value = student.location || '';
                    document.getElementById('studentLevel').value = student.level || 'A1';
                    document.getElementById('groupName').value = student.group_name || '';
                }
            } else {
                title.textContent = 'إضافة طالب جديد';
            }
            
            modal.classList.remove('hidden');
        }

        function closeStudentModal() {
            document.getElementById('studentModal').classList.add('hidden');
            currentEditStudentId = null;
        }

        async function saveStudent(e) {
            e.preventDefault();
            if (!currentUser) return;
            
            const btn = document.getElementById('saveStudentBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> جاري الحفظ...';
            
            const studentObj = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                birth_date: document.getElementById('birthDate').value || null,
                location: document.getElementById('location').value,
                level: document.getElementById('studentLevel').value,
                group_name: document.getElementById('groupName').value,
                session: window.currentSession || null,
            };

            try {
                if (currentEditStudentId) {
                    const { error } = await supabaseClient
                        .from('students')
                        .update(studentObj)
                        .eq('id', currentEditStudentId);
                    if (error) throw error;
                } else {
                    studentObj.teacher_id = currentUser.id;
                    const { error } = await supabaseClient
                        .from('students')
                        .insert([studentObj]);
                    if (error) throw error;
                }
                
                closeStudentModal();
                await loadStudents();
            } catch (error) {
                console.error('Error saving student:', error);
                alert(getFriendlyErrorMessage(error));
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
                if(window.lucide) lucide.createIcons();
            }
        }

        async function deleteStudent(id) {
            if(!confirm('هل أنت متأكد من حذف هذا الطالب؟')) return;
            
            try {
                const { error } = await supabaseClient
                    .from('students')
                    .delete()
                    .eq('id', id);
                if (error) throw error;
                await loadStudents();
            } catch (error) {
                console.error('Error deleting student:', error);
                alert(getFriendlyErrorMessage(error));
            }
        }

        async function loadLessons() {
            if (!currentUser) return;
            const tbody = document.getElementById('lessonsTableBody');
            const language = document.getElementById('languageFilter')?.value;
            const level = document.getElementById('levelFilter')?.value;
            const group = document.getElementById('groupFilter')?.value;
            const month = document.getElementById('monthFilter')?.value;
            const year = document.getElementById('yearFilter')?.value;

            try {
                let query = supabaseClient
                    .from('lessons')
                    .select('*')
                    .order('lesson_date', { ascending: false });
                
                if (userProfile && userProfile.role !== 'admin') {
                    query = query.match({ teacher_id: currentUser.id, ...(window.currentSession ? { session: window.currentSession } : {}) });
                }

                if (level) query = query.eq('level', level);
                if (group) query = query.eq('group_name', group);
                if (month) query = query.eq('month', parseInt(month));
                if (year) query = query.eq('year', parseInt(year));

                const { data, error } = await query;
                if (error) throw error;
                let fetched = data || [];

                if (language) {
                    fetched = fetched.filter(l => {
                        const lLang = l.language || 'اللغة الإنجليزية';
                        return lLang === language || lLang.includes(language) || language.includes(lLang);
                    });
                }

                lessonsData = fetched;
                renderLessonsTable(lessonsData);
            } catch (error) {
                console.error('Error loading lessons:', error);
                if(tbody) tbody.innerHTML = '<tr><td colspan="8" class="text-center p-8 text-red-500">حدث خطأ أثناء تحميل البيانات</td></tr>';
            }
        }

        function renderLessonsTable(dataToRender) {
            const tbody = document.getElementById('lessonsTableBody');
            const downloadBtn = document.getElementById('downloadLessonsBtn');
            if (!tbody) return;
            
            if (dataToRender.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center p-8 text-gray-500">لا توجد دروس مسجلة لهذه التصفية</td></tr>';
                if(window.lucide) lucide.createIcons();
                return;
            }

            if (downloadBtn) downloadBtn.classList.remove('hidden');

            tbody.innerHTML = dataToRender.map(lesson => `
                <tr class="hover:bg-gray-50 transition border-b border-gray-50 last:border-0">
                    <td class="p-4 font-medium text-gray-900">${lesson.teacher_name || '-'}</td>
                    <td class="p-4 text-gray-700" dir="ltr">${lesson.lesson_date || '-'}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 bg-green-50 text-green-700 rounded-md text-xs font-bold">${lesson.language || 'اللغة الإنجليزية'}</span>
                    </td>
                    <td class="p-4">

                const targetLevel = document.getElementById('dlLevel').value || "A1";
                const targetGroup = String(document.getElementById('dlGroup').value || "1");

                // Query Supabase strictly for teacher, level, and group

                if (targetGroup) query = query.eq('group_name', targetGroup);

                const { data: rawLessons, error: queryError } = await query;
                if (queryError) throw queryError;

                const filtered = (rawLessons || []).filter(l => {
                    const lLang = l.language || 'اللغة الإنجليزية';
                    return lLang === targetLanguage || lLang.includes(targetLanguage) || targetLanguage.includes(lLang);

                const fileName = `ورقة_الدروس_${targetLanguage}_${targetLevel}_فوج_${targetGroup}.doc`;

        async function saveLesson(e) {
            e.preventDefault();
            if (!currentUser) return;
            
            const btn = document.getElementById('saveLessonBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> جاري الحفظ...';
            
            const dateStr = document.getElementById('lessonDate').value;
            const dateObj = new Date(dateStr);
            
            let teacherName = '';
            if (userProfile && userProfile.full_name) {
                teacherName = userProfile.full_name;
            } else if (currentUser && currentUser.profile && currentUser.profile.full_name) {
                teacherName = currentUser.profile.full_name;
            } else if (currentUser && currentUser.email) {
                teacherName = currentUser.email;
            }

            let lessonObj = {
                teacher_id: currentUser ? currentUser.id : null,
                teacher_name: teacherName,
                title: document.getElementById('lessonTitle').value,
                level: document.getElementById('lessonLevel').value,
                group_name: document.getElementById('lessonGroup').value,
                session: window.currentSession || null,
                language: document.getElementById('lessonLanguage')?.value || 'اللغة الإنجليزية',
                lesson_date: dateStr,
                notes: document.getElementById('lessonNotes').value,
                month: dateObj.getMonth() + 1,
                year: dateObj.getFullYear()
            };

            try {
                let { error } = await supabaseClient
                    .from('lessons')
                    .insert([lessonObj]);
                
                if (error && error.message && error.message.includes('language')) {
                    delete lessonObj.language;
                    const res = await supabaseClient
                        .from('lessons')
                        .insert([lessonObj]);
                    if (res.error) throw res.error;
                } else if (error) {
                    throw error;
                }
                
                closeLessonModal();
                showLessonNotification('تم حفظ الدرس بنجاح');
                await loadLessons();
            } catch (error) {
                console.error('Error saving lesson:', error);
                showLessonNotification('حدث خطأ أثناء حفظ الدرس: ' + error.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
                if(window.lucide) lucide.createIcons();
            }
        }

                showLessonNotification('حدث خطأ أثناء الحذف: ' + error.message, true);

        }

        function renderAttendanceSection() {
            window.handleAttendanceLevelChange = async function() {
                const level = document.getElementById('attendanceLevel').value;

                groupSelect.innerHTML = '<option value="">اختر الفوج...</option>';

                        .eq('level', level);
                        
                    if (error) throw error;
                    
                    // Sort unique groups
                    const uniqueGroups = [...new Set(data.map(item => item.group_name))].filter(Boolean).sort();

                        groupSelect.innerHTML += `<option value="${group}">${group}</option>`;

                }
